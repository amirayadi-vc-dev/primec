services:
  - type: web
    name: allani-auto
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci
    preDeployCommand: npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SEED_EMPTY_CATALOG
        value: 'true'
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: allani-auto-db
          property: connectionString

databases:
  - name: allani-auto-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []